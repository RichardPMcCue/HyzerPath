apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hyzerpath
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/RichardPMcCue/HyzerPath.git
    targetRevision: main
    path: charts/hyzerpath
    helm:
      valueFiles:
        - values-homelab.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: hyzerpath
  syncPolicy:
    automated:
      selfHeal: true
      prune: false