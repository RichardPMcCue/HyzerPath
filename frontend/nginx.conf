server {
    listen 80;
    root /usr/share/nginx/html;

    # SPA fallback: unknown paths (like /rounds/42) serve index.html
    # so the client-side router can handle them.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Mirrors the production /tiles proxy: satellite tiles served
    # same-origin so tracker blockers don't kill them.
    location /tiles/ {
        proxy_pass https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/;
        proxy_ssl_server_name on;
        proxy_set_header Host server.arcgisonline.com;
    }

    # API: forward to the backend container. The trailing slash on
    # proxy_pass strips the /api prefix, so /api/auth/login arrives
    # at the backend as /auth/login, the same way production works.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}