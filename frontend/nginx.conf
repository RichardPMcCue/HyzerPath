server {
    listen 80;
    root /usr/share/nginx/html;

    # SPA fallback: unknown paths (like /rounds/42) serve index.html
    # so the client-side router can handle them.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Mirrors the production /tiles proxy: satellite tiles served
    # same-origin so tracker blockers don't kill them.
    location /tiles/ {
        proxy_pass https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/;
        proxy_ssl_server_name on;
        proxy_set_header Host server.arcgisonline.com;
    }
}